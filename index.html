<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FlowPilot - Navegação GPS</title>

  <!-- MapLibre GL JS e CSS via CDN -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.3.0/dist/maplibre-gl.css">
  <script src="https://unpkg.com/maplibre-gl@5.3.0/dist/maplibre-gl.js"></script>

  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="theme-color" content="#0f172a">
</head>
<body>

  <!-- Container do Mapa (tela cheia) -->
  <div id="map"></div>

  <!-- Barra Superior Flutuante (Busca) -->
  <div id="top-bar">
    <div class="top-bar-inner">
      <input type="text" id="destino-input" placeholder="Para onde você vai?" autocomplete="off">
      <button id="iniciar-rota-btn" type="button">Iniciar Rota</button>
    </div>
    <div id="sugestoes" class="sugestoes"></div>
  </div>

  <!-- Painel de instrução de navegação (passo atual) - substitui a busca quando há rota ativa -->
  <div id="nav-instruction" class="nav-instruction hidden">
    <span id="instr-maneuver" class="instr-maneuver"></span>
    <div class="instr-text-wrap">
      <span id="instr-text"></span>
      <span id="instr-dist" class="instr-dist"></span>
    </div>
    <button id="nova-rota-btn" type="button" title="Iniciar nova rota" aria-label="Iniciar nova rota">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
        <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm0 18c-4.4 0-8-3.6-8-8s3.6-8 8-8 8 3.6 8 8-3.6 8-8 8z"/>
        <path d="M13 12V7h-2v5H6v2h5v5h2v-5h5v-2h-5z"/>
      </svg>
    </button>
  </div>

  <!-- Botão flutuante: centralizar no veículo -->
  <button id="locate-btn" type="button" aria-label="Centralizar no veículo" title="Centralizar no veículo">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
      <path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm9.5 3a9.9 9.9 0 0 0-8.5-8.5V1h-2v1.5A9.9 9.9 0 0 0 2.5 11H1v2h1.5A9.9 9.9 0 0 0 11 21.5V23h2v-1.5A9.9 9.9 0 0 0 21.5 13H23v-2h-1.5zM12 19.5A7.5 7.5 0 1 1 12 4.5a7.5 7.5 0 0 1 0 15z"/>
    </svg>
    <span class="locate-pulse"></span>
  </button>

  <!-- Botão flutuante: alternar modo noturno -->
  <button id="theme-btn" type="button" aria-label="Alternar modo noturno" title="Alternar modo noturno">
    <svg class="icon-sun" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
      <path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 1.5A3.5 3.5 0 1 1 12 15.5 3.5 3.5 0 0 1 12 8.5zM2 11h3v2H2zM19 11h3v2h-3zM11 2h2v3h-2zM11 19h2v3h-2zM4.2 4.2l2.1 2.1-1.4 1.4-2.1-2.1zM17.8 17.8l2.1 2.1-1.4 1.4-2.1-2.1zM19.8 4.2l-2.1 2.1-1.4-1.4 2.1-2.1zM6.3 17.7l-2.1 2.1-1.4-1.4 2.1-2.1z"/>
    </svg>
    <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
      <path d="M20.6 13.4A8 8 0 0 1 10.6 3.4a8 8 0 1 0 10 10z"/>
    </svg>
  </button>

  <!-- Botão flutuante: simular rota (teste de manobras) -->
  <button id="simul-btn" type="button" aria-label="Simular rota a 10 km/h" title="Simular rota a 10 km/h">
    <svg class="icon-play" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
      <path d="M8 5v14l11-7z"/>
    </svg>
    <svg class="icon-stop" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
      <path d="M6 6h12v12H6z"/>
    </svg>
  </button>

  <!-- Acelerador: aumenta a velocidade da simulação (1x/2x/4x/8x) -->
  <button id="simul-speed-btn" type="button" title="Acelerar a simulação" aria-label="Acelerar a simulação">1x</button>

  <!-- Botão flutuante: camada de tráfego em tempo real (TomTom) -->
  <button id="traffic-btn" type="button" title="Tráfego em tempo real (TomTom)" aria-label="Ativar ou desativar tráfego">🚦</button>

  <!-- Botão flutuante: manutenção / odômetro -->
  <button id="maint-btn" type="button" title="Manutenção e odômetro" aria-label="Configurações de manutenção">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
      <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 0 1 8.4 12 3.6 3.6 0 0 1 12 8.4a3.6 3.6 0 0 1 3.6 3.6 3.6 3.6 0 0 1-3.6 3.6z"/>
    </svg>
  </button>

  <!-- Alerta de rota alternativa sugerida (anti-engarrafamento) -->
  <div id="traffic-alert" class="traffic-alert" role="alert" aria-live="assertive"></div>

  <!-- Modal de manutenção / calibragem do odômetro -->
  <div id="maint-modal" class="maint-modal">
    <div class="maint-modal-card">
      <h3 class="maint-title">Manutenção</h3>
      <label class="maint-field-label" for="cfg-km-atual">KM atual do veículo</label>
      <input type="number" id="cfg-km-atual" class="maint-input" min="0" step="1" inputmode="numeric" placeholder="ex.: 45320">
      <label class="maint-field-label" for="cfg-intervalo-oleo">Intervalo de troca de óleo (km)</label>
      <input type="number" id="cfg-intervalo-oleo" class="maint-input" min="0" step="100" inputmode="numeric" placeholder="ex.: 3000">
      <p class="maint-hint">0 = alerta de intervalo desligado</p>
      <button id="btn-registrar-troca" class="maint-btn primary" type="button">Registrar troca de óleo agora</button>
      <button id="btn-fechar-config" class="maint-btn" type="button">Fechar</button>
    </div>
  </div>

  <!-- Painel Inferior Flutuante (Telemetria) -->
  <div id="bottom-panel">
    <div class="panel-row">
      <div class="speedometer">
        <span class="speed-value" id="velocimetro">0</span>
        <span class="speed-unit">km/h</span>
      </div>
      <div class="route-stats">
        <div class="route-stats-row">
          <div class="stat">
            <span class="stat-label">ETA</span>
            <span class="stat-value" id="eta-time">--:--</span>
          </div>
          <div class="stat">
            <span class="stat-label">DIST</span>
            <span class="stat-value" id="dist-km">0.0 km</span>
          </div>
        </div>
        <div class="stat stat-chegada">
          <span class="stat-label">Chegada</span>
          <span class="stat-value" id="chegada-hora">--:--</span>
        </div>
      </div>
    </div>
    <div class="maintenance-strip">
      <div class="maintenance-item">
        <span class="maint-label">Odômetro</span>
        <span class="maint-value" id="km-odometro">0 km</span>
      </div>
      <div class="maintenance-item oleo" id="oleo-status">
        <span class="maint-label">Óleo</span>
        <span class="maint-value" id="oleo-info">intervalo não configurado</span>
      </div>
    </div>
  </div>

  <!-- Chave local TomTom (opcional; não versionada) -->
  <script src="config.local.js"></script>
  <script src="app.js"></script>
</body>
</html>
