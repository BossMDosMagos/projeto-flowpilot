<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FlowPilot - Navegação GPS</title>

  <!-- Leaflet.js CSS e JS via CDN -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
</head>
<body>

  <!-- Container do Mapa (tela cheia) -->
  <div id="map"></div>

  <!-- Barra Superior Flutuante (Busca) -->
  <div id="top-bar">
    <div class="top-bar-inner">
      <input type="text" id="destino-input" placeholder="Para onde você vai?" autocomplete="off">
      <button id="iniciar-rota-btn" type="button">Iniciar Rota</button>
    </div>
    <div id="sugestoes" class="sugestoes"></div>
  </div>

  <!-- Painel Inferior Flutuante (Telemetria) -->
  <div id="bottom-panel">
    <div class="speedometer">
      <span class="speed-value" id="velocimetro">0</span>
      <span class="speed-unit">km/h</span>
    </div>
    <div class="route-stats">
      <div class="stat">
        <span class="stat-label">ETA</span>
        <span class="stat-value" id="eta-time">--:--</span>
      </div>
      <div class="stat">
        <span class="stat-label">DIST</span>
        <span class="stat-value" id="dist-km">0.0 km</span>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
